<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMP Store - Official Server Shop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding-bottom: 90px; }
    header { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 30px 20px; text-align: center; border-bottom: 2px solid #22c55e; }
    header h1 { font-size: 2.2rem; color: #22c55e; letter-spacing: 1px; }
    header p { color: #94a3b8; margin-top: 8px; }
    .player-box { max-width: 500px; margin: 20px auto; background: #1e293b; padding: 15px; border-radius: 10px; display: flex; gap: 10px; border: 1px solid #334155; }
    .player-box input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #0f172a; color: #fff; outline: none; font-size: 1rem; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin: 20px auto; flex-wrap: wrap; padding: 0 15px; }
    .tab-btn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: #22c55e; color: #0f172a; border-color: #22c55e; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; text-align: center; transition: 0.2s; }
    .card:hover { transform: translateY(-4px); border-color: #22c55e; }
    .card h3 { color: #38bdf8; margin-bottom: 8px; }
    .card p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; min-height: 36px; }
    .price { font-size: 1.3rem; font-weight: bold; color: #22c55e; margin-bottom: 12px; }
    .buy-btn { background: #22c55e; color: #0f172a; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
    .buy-btn:hover { background: #16a34a; }
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; border-top: 2px solid #22c55e; padding: 14px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 200; }
    .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 420px; width: 100%; border: 1px solid #22c55e; text-align: center; }
    .modal-content h2 { color: #22c55e; margin-bottom: 10px; }
    .order-summary { background: #0f172a; padding: 12px; border-radius: 8px; text-align: left; font-size: 0.9rem; margin: 12px 0; color: #e2e8f0; }
    .close-btn { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h1>⚔️ MY SMP STORE</h1>
    <p>Server IP: play.mysmp.net | Instant Rank & Crate Verification</p>
  </header>

  <div class="player-box">
    <input type="text" id="username" placeholder="Apna Minecraft Username likho..." />
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="showCategory('ranks', this)">👑 Ranks (10)</button>
    <button class="tab-btn" onclick="showCategory('crates', this)">📦 Crate Keys (10)</button>
    <button class="tab-btn" onclick="showCategory('extras', this)">💰 Coins & Extras</button>
  </div>

  <div class="container">
    <div class="grid" id="store-grid"></div>
  </div>

  <div class="cart-bar">
    <div>
      <strong>Cart:</strong> <span id="cart-count">0</span> items | 
      <strong>Total:</strong> ₹<span id="cart-total">0</span>
    </div>
    <div>
      <button class="buy-btn" style="width:auto; padding:10px 22px;" onclick="openCheckout()">Checkout / Pay</button>
    </div>
  </div>

  <div class="modal" id="checkout-modal">
    <div class="modal-content">
      <h2>UPI / Discord Checkout</h2>
      <p style="font-size:0.9rem; color:#94a3b8;">1. Niche di gayi UPI ID par pay karein.<br>2. Order details copy karke Discord ticket mein screenshot bhejein.</p>
      <div class="order-summary" id="order-details"></div>
      <p style="margin: 10px 0; font-weight: bold; color: #38bdf8;">UPI ID: yourname@upi</p>
      <button class="buy-btn" onclick="copyOrder()">📋 Copy Order & Open Discord</button>
      <br>
      <button class="close-btn" onclick="closeCheckout()">Close</button>
    </div>
  </div>

  <script>
    // Yahan apna Discord Invite Link daal sakte ho
    const DISCORD_INVITE = "https://discord.gg/yourserver"; 

    const storeData = {
      ranks: [
        { name: "VIP Rank", price: 49, desc: "/fly in lobby, 2 Homes, VIP Kit" },
        { name: "VIP+ Rank", price: 99, desc: "3 Homes, /workbench, VIP+ Kit" },
        { name: "MVP Rank", price: 149, desc: "5 Homes, /enderchest, MVP Kit" },
        { name: "MVP+ Rank", price: 199, desc: "7 Homes, /heal, Colored Chat" },
        { name: "Pro Rank", price: 299, desc: "10 Homes, /feed, Pro Kit" },
        { name: "Elite Rank", price: 399, desc: "12 Homes, /repair, Elite Kit" },
        { name: "Master Rank", price: 499, desc: "15 Homes, /nick, Master Kit" },
        { name: "Legend Rank", price: 699, desc: "20 Homes, Priority Queue, Legend Kit" },
        { name: "Titan Rank", price: 999, desc: "25 Homes, All Perks, Titan Kit" },
        { name: "Immortal Rank", price: 1499, desc: "Unlimited Homes, Custom Prefix, Immortal Kit" }
      ],
      crates: [
        { name: "Vote Crate Key", price: 10, desc: "Basic starter gear & resources" },
        { name: "Common Crate Key", price: 20, desc: "Iron/Diamond tools & food" },
        { name: "Uncommon Crate Key", price: 35, desc: "Enchanted books & armor" },
        { name: "Rare Crate Key", price: 50, desc: "Netherite scraps & spawners" },
        { name: "Epic Crate Key", price: 80, desc: "Custom enchants & rare keys" },
        { name: "Legendary Crate Key", price: 120, desc: "Full Netherite gear & beacons" },
        { name: "Mythic Crate Key", price: 160, desc: "OP Boss weapons & totem packs" },
        { name: "Godly Crate Key", price: 220, desc: "Maxed armor & exclusive tags" },
        { name: "Dragon Crate Key", price: 300, desc: "Elytra, Dragon Egg & rare items" },
        { name: "Season Crate Key", price: 400, desc: "Limited edition seasonal items" }
      ],
      extras: [
        { name: "10,000 In-Game Coins", price: 49, desc: "Shop mein use karne ke liye coins" },
        { name: "50,000 In-Game Coins", price: 199, desc: "Mega coin bundle + bonus" },
        { name: "Unban Pass", price: 149, desc: "Ek baar ban hatane ke liye" },
        { name: "Custom Chat Tag", price: 79, desc: "Apne naam ke aage custom tag lagao" }
      ]
    };

    let cart = [];

    function showCategory(category, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const grid = document.getElementById('store-grid');
      grid.innerHTML = '';
      storeData[category].forEach(item => {
        grid.innerHTML += `
          <div class="card">
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="price">₹${item.price}</div>
            <button class="buy-btn" onclick="addToCart('${item.name}', ${item.price})">+ Add to Cart</button>
          </div>
        `;
      });
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCart();
    }

    function updateCart() {
      document.getElementById('cart-count').innerText = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = total;
    }

    function openCheckout() {
      const user = document.getElementById('username').value.trim();
      if (!user) return alert("Pehle upar apna Minecraft Username daalo!");
      if (cart.length === 0) return alert("Cart khali hai! Pehle koi rank ya crate add karo.");
      
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const itemsList = cart.map(i => `• ${i.name} (₹${i.price})`).join('<br>');
      document.getElementById('order-details').innerHTML = `
        <strong>Player:</strong> ${user}<br>
        <strong>Items:</strong><br>${itemsList}<br>
        <hr style="margin:8px 0; border-color:#334155;">
        <strong>Total Payable: ₹${total}</strong>
      `;
      document.getElementById('checkout-modal').style.display = 'flex';
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').style.display = 'none';
    }

    function copyOrder() {
      const user = document.getElementById('username').value.trim();
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      const text = `Minecraft Username: ${user}\nItems: ${cart.map(i => i.name).join(', ')}\nTotal Paid: ₹${total}`;
      navigator.clipboard.writeText(text);
      alert("Order details copy ho gayi hain! Ab Discord ticket mein paste karein.");
      window.open(DISCORD_INVITE, '_blank');
    }

    showCategory('ranks');
  </script>
</body>
</html>
